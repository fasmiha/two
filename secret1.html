<html><head>
<title>For my mine🌍</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background-image: url("small heart.jpeg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;

    width: 100px;
    height: 45px;

    font-size: 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;

    color: white;
    background-color: #d39bae;

    border: none;
    border-radius: 10px;
    cursor: pointer;
}

img {
    width: 500px;
    max-width: 90%;
    height: auto;

    border-radius: 20px;
}

@media (max-width: 599px) {

    img {
        width: 70%;
    }

}

</style>

</head>
<body>

<img src="secretimage1.jpeg">

<br><br>

<caption>The first time i met you, I had no idea i would love you this much💏🤗
</caption>
