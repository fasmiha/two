<!DOCTYPE html>
<html>

<head>

<title>For my mine🌍</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #f8dddd;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 80%;
    max-width: 1000px;
    height: 500px;

    display: flex;

    background: #fff5f5;
    border-radius: 25px;
    overflow: hidden;

    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.back-button {
    position: fixed;
    top: 20px;
    left: 20px;

    width: 100px;
    height: 45px;

    font-size: 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 700;

    color: white;
    background-color: #d39bae;

    border: none;
    border-radius: 10px;
    cursor: pointer;
}

/* LEFT SIDE */

.left {
    width: 40%;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #fff5f5;
}

.left img {
    width: 90%;
    height: 90%;

    object-fit: contain;

    border-radius: 20px;
}


/* RIGHT SIDE */

.right {
    width: 60%;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    background: #ffe1e1;
}

h1 {
    color: #a94064;
    font-size: 35px;
    margin-bottom: 25px;
}


/* PASSWORD DISPLAY */

.password {
    width: 70%;
    height: 65px;

    border: 3px solid #d87891;
    border-radius: 15px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 35px;
    letter-spacing: 12px;

    color: #c04f6d;

    margin-bottom: 25px;
}


/* KEYPAD */

.keypad {
    width: 70%;

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 12px;
}

.key {
    height: 60px;

    border: none;
    border-radius: 12px;

    background: #e9a7b5;

    color: #8f3d58;

    font-size: 25px;
    font-weight: bold;

    cursor: pointer;
}

.key:active {
    transform: scale(0.95);
}


/* BOTTOM BUTTONS */

.bottom {
    margin-top: 15px;

    display: flex;
    gap: 15px;
}

.bottom button {
    width: 100px;
    height: 50px;

    border: none;
    border-radius: 12px;

    background: #d87891;

    color: white;

    font-size: 20px;

    cursor: pointer;
}


/* MOBILE */

@media (max-width: 599px) {

    body {
        padding: 20px;
    }

    .container {
        width: 100%;
        height: auto;

        flex-direction: column;
    }

    .left {
        width: 100%;
        height: 250px;
    }

    .left img {
        width: 90%;
        height: 90%;
    }

    .right {
        width: 100%;
        padding: 25px 15px 30px;
    }

    h1 {
        font-size: 28px;
    }

    .password {
        width: 90%;
        height: 55px;
        font-size: 28px;
    }

    .keypad {
        width: 90%;
        gap: 8px;
    }

    .key {
        height: 55px;
        font-size: 22px;
    }

}
    .zero {
    grid-column: 2;
}

</style>

</head>


<body>


<div class="container">


    <!-- LEFT 40% -->

    <div class="left">

        <img src="cartoon2.jpeg">

    </div>


    <!-- RIGHT 60% -->

    <div class="right">

        <h1>Our Anniversary❤️</h1>


        <!-- PASSWORD -->

        <div class="password" id="password">
        </div>


        <!-- NUMBER KEYBOARD -->

        <div class="keypad">

            <button class="key" onclick="addNumber('1')">1</button>
            <button class="key" onclick="addNumber('2')">2</button>
            <button class="key" onclick="addNumber('3')">3</button>

            <button class="key" onclick="addNumber('4')">4</button>
            <button class="key" onclick="addNumber('5')">5</button>
            <button class="key" onclick="addNumber('6')">6</button>

            <button class="key" onclick="addNumber('7')">7</button>
            <button class="key" onclick="addNumber('8')">8</button>
            <button class="key" onclick="addNumber('9')">9</button>

           <button class="key zero" onclick="addNumber('0')">0</button>

        </div>


        <div class="bottom">

            <button onclick="deleteNumber()">⌫</button>

            <button onclick="checkPassword()">✓</button>

        </div>


        <p id="message"></p>


    </div>


</div>


<script>

let enteredPassword = "";

function addNumber(number) {

    enteredPassword += number;

    document.querySelector("#password").textContent =
        "*".repeat(enteredPassword.length);

}


function deleteNumber() {

    enteredPassword =
        enteredPassword.slice(0, -1);

    document.querySelector("#password").textContent =
        "*".repeat(enteredPassword.length);

}


function checkPassword() {

    if (enteredPassword === "0401") {

        window.location.href = "secret1.html";

    }
    else {

        document.querySelector("#message").textContent =
            "Wrong password 💔";

        enteredPassword = "";

        document.querySelector("#password").textContent = "";

    }

}

</script>

<button class="back-button" onclick="history.back()">← Back</button>

</body>

</html>
